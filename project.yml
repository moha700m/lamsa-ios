name: Lamsa
options:
  bundleIdPrefix: com.moha700m
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Lamsa:
    type: application
    platform: iOS
    sources: [Lamsa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.lamsa
        PRODUCT_NAME: Lamsa
        INFOPLIST_FILE: Lamsa/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lamsa/Lamsa.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
  LamsaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LamsaTests]
    dependencies:
      - target: Lamsa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.lamsa.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  Lamsa:
    build:
      targets:
        Lamsa: all
        LamsaTests: [test]
    test:
      targets: [LamsaTests]
